spring.application.name=banco-central-xyz

# ============================================================
# SPRING CLOUD CONFIG
# ============================================================

spring.config.import=optional:configserver:http://localhost:8888


# ============================================================
# OAUTH2 RESOURCE SERVER
# ============================================================

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks


# ============================================================
# POSTGRESQL
# La configuracion principal se obtiene desde Config Server.
# ============================================================

# spring.datasource.url=jdbc:postgresql://ep-curly-salad-acqh1vb2.sa-east-1.aws.neon.tech/neondb?sslmode=require
# spring.datasource.username=neondb_owner
# spring.datasource.password=${DB_PASSWORD}

# spring.sql.init.mode=always
# spring.sql.init.platform=postgresql


# ============================================================
# JWT
# ============================================================

# jwt.secret=${JWT_SECRET}


# ============================================================
# KAFKA - SEMANA 7
# ============================================================

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Los eventos compartidos de ambos microservicios utilizaran este package.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.duoc.eventos

# Permite consumir eventos existentes cuando se utiliza un grupo nuevo.
spring.kafka.consumer.auto-offset-reset=earliest