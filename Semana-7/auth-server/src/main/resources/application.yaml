server:
  port: 9000

spring:
  application:
    name: auth-server
  security:
    oauth2:
      authorizationserver:
        client:
          ms-seguridad-client:
            registration:
              client-id: ms-seguridad-client
              client-secret: "{noop}secret123"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - cuentas.read
                - cuentas.write
            require-authorization-consent: false

logging:
  level:
    org.springframework.security: INFO