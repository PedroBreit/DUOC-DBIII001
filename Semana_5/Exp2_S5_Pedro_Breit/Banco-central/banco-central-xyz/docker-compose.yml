services:

  postgres:
    image: postgres:16
    container_name: banco-xyz-postgres

    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: banco_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - banco_xyz_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_admin -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  banco_xyz_data: