server:
  port: 8081

spring:
  application:
    name: banco-central-xyz
  datasource:
    url: jdbc:postgresql://ep-curly-salad-acqh1vb2.sa-east-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      platform: postgresql
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true