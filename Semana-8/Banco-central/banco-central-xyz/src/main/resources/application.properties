# =========================================================
# BANCO CENTRAL XYZ
# =========================================================

spring.application.name=banco-central-xyz
server.port=${SERVER_PORT:8081}


# =========================================================
# SPRING CLOUD CONFIG
# =========================================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}


# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true


# =========================================================
# BASE DE DATOS POSTGRESQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.platform=postgresql


# =========================================================
# OAUTH2 / JWT
# =========================================================

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}


# =========================================================
# APACHE KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.duoc.eventos

spring.kafka.consumer.auto-offset-reset=earliest


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.duoc=INFO