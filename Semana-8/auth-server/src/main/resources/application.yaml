server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: auth-server

  security:
    oauth2:
      authorizationserver:
        client:
          ms-seguridad-client:
            registration:
              client-id: ${OAUTH_CLIENT_ID:ms-seguridad-client}
              client-secret: "${OAUTH_CLIENT_SECRET:{noop}secret123}"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - cuentas.read
                - cuentas.write
            require-authorization-consent: false

logging:
  level:
    org.springframework.security: INFO